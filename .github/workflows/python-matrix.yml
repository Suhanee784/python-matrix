name: Python lint

on:
  workflow_dispatch:

jobs:
  validate:
      runs-on: ubuntu-latest

      steps:
        - name: checkput code
          uses: actions/checkout@v4

        - name: Setup python 3.13
          uses: actions/setup-python@v5
          with:
            python-version: "3.13"

        - name: install libraries
          run: pip install -r requirements.txt

        - name: run linter
          run: flake8 main.py
          
    
