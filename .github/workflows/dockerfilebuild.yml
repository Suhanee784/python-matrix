name: Docker build & push
on:
  workflow_dispatch:

jobs:
  build_push:
     env:
       DOCKERHUB_USER: ${{ vars.DOCKERHUB_USER }}
       DOCKER_TAG: ${{ github.sha }}
     runs-on: ubuntu-latest

     steps:
       - name: code checkout
         uses: actions/checkout@v4

       - name: login docker hub
         uses: docker/login-action@v3
         with:
           username: ${{ vars.DOCKERHUB_USER }}
           password: ${{ secrets.DOCKER_TOKEN }}
      
       - name: build and push
         uses: docker/build-push-action@v6
         with:
           context: .
           push: true
           tags: |
                 ${{ vars.DOCKERHUB_USER }}/github-actions-app:${{ github.ref_name }}
                 ${{ vars.DOCKERHUB_USER }}/github-actions-app:latest
                 ${{ vars.DOCKERHUB_USER }}/github-actions-app:${{ github.sha }}

       - name: deploy with docker compose
         run: docker compose down && docker compose up -d --build --force-recreate
                  
