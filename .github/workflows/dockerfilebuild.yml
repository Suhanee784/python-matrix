name: Docker build & push
on:
  workflow_dispatch:

jobs:
  build & push:
     runs-on: ubuntu-latest

     steps:
       - name: code checkout
         uses: actions/checkout@v4

       - name: login docker hub
         uses: docker/login-action@v3
         with:
           username: ${{vars.Dockerhub_user}}
           password: ${{secrets.docker_Token}}
